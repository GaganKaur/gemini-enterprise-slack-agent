[project]
name = "yahoo-ge-test-harness"
version = "0.1.0"
description = "Yahoo Gemini Enterprise Latency Benchmarking Test Harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "google-auth>=2.23.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
index-url = "https://pypi.org/simple/"
